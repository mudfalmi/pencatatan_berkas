services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pencatatan-berkas:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Persist uploads and logs outside the container.
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$p = (int) (getenv(\"PORT\") ?: 8080); $$s = @fsockopen(\"127.0.0.1\", $$p); exit($$s ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-storage:
