services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pencatatan-berkas:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Persist uploads and logs outside the container.
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 80); exit($$s ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-storage:
